name: adwaitter
description: Cross-platform GNOME Adwaita UI widget library and design system for Flutter (Android, iOS, Web, Linux, macOS, Windows).
version: 1.0.0-alpha.12
homepage: https://github.com/CarrsterX/Adwaitter
repository: https://github.com/CarrsterX/Adwaitter
issue_tracker: https://github.com/CarrsterX/Adwaitter/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: false

  fonts:
    - family: AdwaitaSans
      fonts:
        - asset: assets/fonts/AdwaitaSans-Regular.ttf
        - asset: assets/fonts/AdwaitaSans-Italic.ttf
          style: italic
    - family: AdwaitaMono
      fonts:
        - asset: assets/fonts/AdwaitaMono-Regular.ttf
        - asset: assets/fonts/AdwaitaMono-Bold.ttf
          weight: 700
